# Adds Caddy (automatic HTTPS) in front of the server. Used by deploy/setup-server.sh
# via COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.caddy.yml in .env.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
