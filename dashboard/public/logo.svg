<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="openv360">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12857a"/>
      <stop offset="1" stop-color="#0b5d55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- 360° ring with a gap -->
  <path d="M32 13 a19 19 0 1 1 -13.4 5.6" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <!-- forward/scan tick -->
  <path d="M32 13 l6.5 -5 l0 10 z" fill="#f2b544"/>
  <!-- centre lens -->
  <circle cx="32" cy="32" r="7.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3.2" fill="#0b5d55"/>
</svg>
