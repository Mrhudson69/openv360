# Builds and publishes the openv360 desktop agent for Windows, macOS, and Linux.
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The job builds the Tauri app in `agent/` for every platform and attaches the
# installers (dmg/app, deb/AppImage, nsis) to a DRAFT GitHub Release named after
# the tag. Review the draft, then publish it. Tags containing `beta`/`rc` are
# marked as pre-releases automatically.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  build-agent:
    name: build agent (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel) -> dmg + .app
          - label: macOS (universal)
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # Linux -> .deb + AppImage
          - label: Linux (deb + AppImage)
            platform: ubuntu-24.04
            rust-targets: ""
            args: ""
          # Windows -> NSIS installer
          - label: Windows (nsis)
            platform: windows-latest
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The agent's package.json provides @tauri-apps/cli, which tauri-action invokes.
      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install agent JS dependencies
        working-directory: agent
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only macOS needs the extra Apple targets for the universal build.
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri

      # Tauri's Linux build needs WebKitGTK and friends. Not needed on mac/Windows.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            pkg-config

      - name: Build and publish agent
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agent
          tagName: ${{ github.ref_name }}
          releaseName: "openv360 ${{ github.ref_name }}"
          releaseDraft: false
          # While the project is in the 0.x beta phase there is no stable release,
          # so the newest release MUST be GitHub's "latest" — otherwise the
          # `releases/latest/download` redirect that install.sh and the server use
          # 404s. GitHub excludes pre-releases from "latest", so we publish betas
          # as normal releases (the name/notes still say beta). Revisit once a
          # stable v1.0.0 exists: later betas can then be prerelease again.
          prerelease: false
          args: ${{ matrix.args }}

  # tauri-action names assets like `openv360_0.1.0_amd64.deb`, but the server and
  # one-line installers fetch stable, version-less names (`openv360-agent_amd64.deb`,
  # …). Mirror the built assets under those names so `install.sh` /
  # `/downloads` → GitHub-releases redirects resolve.
  stable-asset-names:
    name: publish installer-friendly asset names
    needs: build-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror release assets under installer names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dl out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern 'openv360_*' || true
          copy() {
            local src
            src=$(ls dl/$1 2>/dev/null | head -1 || true)
            if [ -n "${src:-}" ] && [ -f "$src" ]; then cp "$src" "out/$2"; echo "  $src -> $2"; fi
          }
          copy 'openv360_*_amd64.deb'           openv360-agent_amd64.deb
          copy 'openv360_*_arm64.deb'           openv360-agent_arm64.deb
          copy 'openv360_*_amd64.AppImage'      openv360-agent_x86_64.AppImage
          copy 'openv360_*universal.app.tar.gz' openv360-agent_macos-universal.app.tar.gz
          copy 'openv360_*_x64-setup.exe'       openv360-agent_x64-setup.exe
          if ls out/* >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            echo "mirrored:"; ls -1 out/
          else
            echo "no matching assets found to mirror"; exit 1
          fi
