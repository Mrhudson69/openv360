# Funding / sponsorship links for openv360.
# Uncomment and fill in the platforms you actually use. Leaving a key set to a
# placeholder will show a broken "Sponsor" button, so keep handles commented
# out until they are real.

# github: [] # up to 4 GitHub Sponsors usernames, e.g. [Mrhudson69]
# patreon: # a single Patreon username
# open_collective: # an Open Collective username
# ko_fi: # a single Ko-fi username
# tidelift: # e.g. npm/openv360
# community_bridge: # a Community Bridge project name
# liberapay: # a Liberapay username
# issuehunt: # an IssueHunt username
# lfx_crowdfunding: # an LFX Crowdfunding project name
# polar: # a Polar username
# buy_me_a_coffee: # a Buy Me a Coffee username
# thanks_dev: # a thanks.dev username
# custom: [] # up to 4 custom URLs, e.g. ['https://example.com/donate']
