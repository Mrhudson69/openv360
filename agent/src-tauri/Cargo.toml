[package]
name = "openv360-agent"
version = "0.1.6"
edition = "2024"
description = "openv360 desktop agent"
license = "MIT"

[lib]
name = "openv360_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
active-win-pos-rs = "0.11.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gethostname = "1.1.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
semver = "1.0.28"
sha2 = "0.11.1"
os_info = "3.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt", "signal"] }
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
tauri-build = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.0", default-features = false, features = ["async-io", "screenshot"] }
url = "2.5.8"
x11rb = { version = "0.14.0", features = ["screensaver"] }
zbus = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Live Screen-Recording permission probe (CGPreflight caches per-process).
core-graphics = "0.23"
core-foundation = "0.9"

[profile.release]
# Tuned for fast CI builds while keeping the binary small. `thin` LTO links far
# faster than fat LTO (`true`) for nearly the same size/perf, and 16 codegen
# units parallelise the final crate's codegen (release defaults to 1, which is
# single-threaded and slow). Net: a large cut in build time at a negligible cost.
lto = "thin"
codegen-units = 16
opt-level = "s"
strip = true
# Any panic aborts the process instead of silently killing one async task and
# leaving the agent half-dead. The service manager (systemd Restart=always /
# launchd KeepAlive) then relaunches a clean process, so the agent self-heals and
# can never get wedged offline. Queued data lives in SQLite, so nothing is lost.
panic = "abort"
